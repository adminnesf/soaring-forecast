name: Forecast

on:
  schedule:
    # Friday through Sunday, at 11:41, 17:41, and 23:41 UTC.
    - cron: "41 11,17,23 * * 5,6,0"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run forecast
        run: python -c 'from flyforecast.springfield import build; build(archive=False)'
      - name: Retain forecast snapshot for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: forecast-snapshot
          path: site/forecast.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
