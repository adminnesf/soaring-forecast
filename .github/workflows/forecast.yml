name: Forecast

on:
  schedule:
    # Friday through Sunday, at 11:41, 17:41, and 23:41 UTC.
    - cron: "41 11,17,23 * * 5,6,0"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  forecast:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run forecast
        run: python -m flyforecast.springfield
      - name: Prune forecast snapshots older than 14 days
        run: python -c 'from flyforecast.history import prune_runs; prune_runs(keep_days=14)'
      - name: Save forecast history
        run: |
          git config user.name "flying-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Forecast run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
